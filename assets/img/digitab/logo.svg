<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="DigiTab POS logosu">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0" stop-color="#2a2926"/>
      <stop offset="1" stop-color="#151514"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#glow)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <g transform="translate(0 12)">
  <!-- Adisyon fişi: üst köşeler yuvarlak, alt kenar yırtık -->
  <path d="M169 48H231Q245 48 245 62V168L237.5 159L230 168L222.5 159L215 168L207.5 159L200 168L192.5 159L185 168L177.5 159L170 168L162.5 159L155 168V62Q155 48 169 48Z" fill="#ebe9e4"/>
  <!-- D harfi -->
  <path d="M179 77V135H193A29 29 0 0 0 193 77Z" fill="none" stroke="#1d1c1a" stroke-width="9" stroke-linejoin="round"/>
  <!-- Canlı sipariş noktası -->
  <circle cx="245" cy="48" r="11" fill="#4f9a73" stroke="#1f1e1c" stroke-width="5"/>
  </g>

  <text x="200" y="240" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5" fill="#ebe9e4">DigiTab</text>
</svg>
